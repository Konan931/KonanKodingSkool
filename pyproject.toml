[project]
name = "konan-coderclass"
version = "0.1.0"
description = "Konan Koding Skool — teaching materials for basic geometry and binary exercises"
authors = ["Klaus Bernt <klaus@example.com>"]
readme = "TEACHING_README.md"
requires-python = ">=3.10"

[project.dependencies]
pytest = "^9.0"
numpy = "^2.0"
pandas = "^2.0"
matplotlib = "^3.0"

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"
